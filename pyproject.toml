[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A reusable maze generator (DFS build, BFS solve, hex output)."
authors = [{ name = "jzorreta, ljeronim" }]
requires-python = ">=3.10"
readme = "mazegen/README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen*"]

[tool.setuptools.package-data]
mazegen = ["README.md"]

